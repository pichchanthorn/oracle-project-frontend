<div class="forbidden-page">
  <section class="forbidden-card" role="alert">
    <span class="material-symbols-outlined forbidden-icon" aria-hidden="true">lock</span>
    <p class="forbidden-code">403</p>
    <h2>Access Forbidden</h2>
    <p class="forbidden-message">
      You're signed in, but your account doesn't have permission to view this page.
      If you believe this is a mistake, contact your administrator.
    </p>
    <button class="primary-action" type="button" (click)="goToDashboard()">
      <span class="material-symbols-outlined" aria-hidden="true">grid_view</span>
      Back to Dashboard
    </button>
  </section>
</div>
